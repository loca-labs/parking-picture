name: Create Preview Builds

jobs:
  build_android:
    type: build # This job type creates an internal-distribution APK for Android
    params:
      platform: android
      profile: preview
  build_ios:
    type: build # This job type creates an ad hoc internal-distribution build for iOS
    params:
      platform: ios
      profile: preview
      refresh_ad_hoc_provisioning_profile: true
